name: Test

# Started by hand only, from the Actions tab: no push, pull request,
# or schedule runs it, so it uses no Actions minutes on its own.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The tests start the AppHost, with Keycloak in a container.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # On Linux, OpenSSL trusts the certificate only through SSL_CERT_DIR,
      # which the trust command checks and the tests need.
      - name: Trust the ASP.NET Core development certificate
        run: |
          export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs"
          echo "SSL_CERT_DIR=$SSL_CERT_DIR" >> "$GITHUB_ENV"
          dotnet dev-certs https --trust

      - name: Test
        run: dotnet test --project Tests
